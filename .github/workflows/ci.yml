name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Build + determinism test on every desktop OS. The golden-hash test proves
  # every platform simulates bit-identically.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            cmake_args: ""
          - os: windows-latest
            name: windows
            cmake_args: "-DMM3_FETCH_SDL2=ON"
          - os: macos-latest
            name: macos
            cmake_args: "-DMM3_FETCH_SDL2=ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release
      - name: Determinism tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect game files
        shell: bash
        run: |
          mkdir -p dist
          cp build/mm3 dist/ 2>/dev/null || cp build/Release/mm3.exe dist/ 2>/dev/null || true
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: mm3-${{ matrix.name }}
          path: dist/

  # Browser build (WebAssembly). Also runs the determinism test under Node.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-web
      - name: Determinism tests (WebAssembly)
        run: ctest --test-dir build-web --output-on-failure
      - name: Collect web files
        run: |
          mkdir -p web-dist
          cp build-web/index.html build-web/index.js build-web/index.wasm web-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mm3-web
          path: web-dist/

  # Publishes the web build to the gh-pages branch, served by GitHub Pages:
  #   main           -> https://bambitp.github.io/mm3/
  #   other branches -> https://bambitp.github.io/mm3/b/<branch, / replaced by ->/
  # One-time setup: repo Settings -> Pages -> Source: "Deploy from a branch",
  # branch gh-pages, folder / (root). See docs/TESTING.md.
  deploy-web:
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mm3-web
          path: web-dist
      - name: Pick destination folder
        id: dest
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "url=https://bambitp.github.io/mm3/" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            echo "dir=b/$slug" >> "$GITHUB_OUTPUT"
            echo "url=https://bambitp.github.io/mm3/b/$slug/" >> "$GITHUB_OUTPUT"
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web-dist
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
      - name: Link
        run: echo "Play at ${{ steps.dest.outputs.url }} (once Pages is enabled)" >> "$GITHUB_STEP_SUMMARY"
